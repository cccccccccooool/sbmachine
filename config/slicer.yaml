slicer:
  # Game/break frame classifier checkpoint.
  model: models/qiepian/frame_type_classifier.pt

  # Sample one frame every N video seconds. Lower values improve boundary precision but cost more decode/inference time.
  interval_sec: 1.0

  # Trailing majority-vote window for frame labels. Larger values suppress flicker but delay transitions.
  smooth_window: 5

  # Drop detected live segments shorter than this many seconds.
  min_live_sec: 20

  # Always bridge adjacent live segments when the gap is at most this value unless replay evidence vetoes it.
  bridge_gap_sec: 3

  # Device for the lightweight game/break classifier: auto, cpu, cuda, or cuda:N.
  device: auto

  # Parallel contiguous video ranges. 1 disables multiprocessing; start with 4 and reduce if CPU/RAM is constrained.
  workers: 10
