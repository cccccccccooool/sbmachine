audio_tools:
  loud_onset:
    sample_rate: 16000     # 音频采样率（Hz）；输入音频应按此采样或由工具重采样。
    flux_threshold: 0.6     # onset_strength 动态阈值系数（相对均值的倍数触发点）
    peak_mult: 6.0          # 峰值高于均值 6 倍才算强瞬态
    min_gap_sec: 0.4        # 相邻 onset 最小间隔（秒）

  asr:
    # FunASR models — paraformer-zh maps to Paraformer-Large with timestamp output
    # Do NOT swap to speech_paraformer-large_*_pytorch base; it lacks sentence timestamps
    model: paraformer-zh    # FunASR 主 ASR 模型；输出带句级时间戳。
    vad_model: fsmn-vad     # 语音活动检测模型；用于切掉静音区间。
    punc_model: ct-punc     # 标点恢复模型；补充 ASR 文本标点。
    max_single_segment_time: 30000  # 单段最长时长（毫秒）。

  speaker:
    # ModelScope models — 16kHz, no HuggingFace token required
    diarization_model: iic/speech_campplus_speaker-diarization_common  # 说话人分离模型。
    sv_model: iic/speech_campplus_sv_zh-cn_16k-common  # 说话人向量/相似度模型。
    asr_model: iic/SenseVoiceSmall  # 说话人流水线使用的 ASR 模型。
    sample_rate: 16000  # 说话人音频采样率（Hz）。
    sim_threshold: 0.35  # 声纹相似度低于此值时不归并为同一说话人。
    sample_per_spk: 5  # 每个说话人用于建立声纹原型的样本数。
    min_dur: 1.0  # 纳入说话人分析的最短片段（秒）。
    max_dur: 12.0  # 单个声纹样本的最长片段（秒）。

  filter:
    vllm_base_url: http://127.0.0.1:8000/v1  # 音频过滤阶段调用的 OpenAI 兼容接口。
    vllm_model: qwen3  # 服务端登记的模型名。
    timeout: 30  # 单次过滤请求超时（秒）。

  paths:
    input: data/audio/6657_merged.wav  # 音频分析输入文件。
    segments: data/audio/6657_segments_ai.jsonl  # 初步音频片段 JSONL。
    filtered_audio: data/audio/6657_ai_filtered.wav  # 过滤后的音频输出。
    segments_final: data/audio/6657_segments_final.jsonl  # 最终音频片段 JSONL。
