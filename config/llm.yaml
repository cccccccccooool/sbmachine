llm:
  backend: vllm              # 通用 LLM 后端：vllm 或 api。
  base_url: http://127.0.0.1:8000/v1  # OpenAI 兼容聊天接口地址。

  temperature: 0.75  # 通用采样温度；越高越发散。
  timeout_sec: 300  # 单次 LLM 请求超时（秒）。
  num_ctx: 16384  # 上下文窗口上限（token）。
  enable_thinking: false  # 是否请求模型输出思考过程；正式稿通常关闭。
  frequency_penalty: 0.3  # 重复 token 惩罚。

semantic:
  model: qwen3  # 兼容旧调用的默认语义模型名。
  analyst_backend: vllm  # Phase3a 分析后端：vllm 或 api。
  style_backend: vllm  # Phase3b 风格化后端：vllm 或 api。
  analyst_model: qwen3  # Phase3a 使用的 served-model 名称。
  style_model: qwen3  # Phase3b 使用的 served-model/LoRA 名称。
  analyst_concurrent_rounds: 1  # 同时处理的回合数；受显存和服务吞吐限制。
  analyst_max_tokens: 256  # Phase3a 单窗口最大输出 token 数。
  analyst_temperature: 0.3  # Phase3a 采样温度。
  analyst_repeat_penalty: 1.3  # Phase3a 重复内容惩罚。
  analyst_top_p: 0.9  # Phase3a nucleus sampling 截断值。

  window_max_sec: 10  # Phase3 语义窗口最大长度（秒）。
  window_min_sec: 3  # Phase3 语义窗口最小长度（秒）。

paths:
  style_skill: Prompt/skill/style_skill.md  # Phase3b 风格技能文件。
