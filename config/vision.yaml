demo:
  parsed_dir: output/demo  # 已解析 demo 工件目录。
  anchor_tolerance_sec: 2.0  # demo 事件与视频时间允许的对齐误差（秒）。
  plant_empty_timer_frames: 3  # 连续多少个空 timer 采样后允许进入炸弹事件冻结判断。

vision:
  crop_padding_px: 4  # OCR crop 外扩像素。
  yolo:
    enabled: true  # 是否启用 Phase2 HUD YOLO。
    model_path: models\yolo\yolo_cs2.pt  # HUD YOLO 权重唯一配置来源。
    classes_file: data/vision/yolo_background/default/classes.json  # HUD 类别定义文件。
    conf_threshold: 0.35  # YOLO 最低检测置信度。
    white_frame_mean_threshold: 245  # 画面均值达到该值时判为白屏/闪光帧。
    skip_labels: [flash]  # 保留给 YOLO gate 的忽略标签。
  pov_ocr:
    # Normalized x1,y1,x2,y2 of the "Currently watching: XXX" name bar.
    # Calibrate by running: ffmpeg -ss 60 -i data/raw/match.mp4 -frames:v 1 /tmp/frame.png
    box: "0.42,0.90,0.58,0.97"  # 仅保留给人工调试；生产仅使用 YOLO 定位的 POV 框。
    min_match_score: 0.6  # OCR 文本与 demo roster 的最低匹配分。
    min_confidence: 0.35  # OCR 低于此置信度不绑定 POV。
    early_accept_confidence: 0.75  # 任一 OCR 变体达到该置信度后停止继续增强识别。
    enabled: true  # 是否启用 POV OCR。
    white_saturation_max: 60  # POV 框内候选白色文字的最大 HSV 饱和度。
    white_value_min: 220  # POV 框内候选白色文字的最小 HSV 明度。
    white_ratio_threshold: 0.01  # 白色像素比例达到该值才调用 POV OCR。
    spectator_min_frames: 3  # 连续无可靠姓名多少帧后转为导播视角，不沿用旧 POV。
  timer_ocr:
    box: "0.46,0.00,0.54,0.06"  # YOLO 未定位 timer 时使用的归一化 ROI。
    enabled: false  # 是否启用 timer 固定 ROI fallback。

  score_ocr:
    # YOLO class "score" / "top_hud" takes priority when detected.
    # Set enabled: true + box to activate fixed-ROI fallback before YOLO is retrained.
    box: ""  # YOLO 未定位 score 时使用的归一化 ROI；空值表示无 fallback。
    enabled: false  # 是否启用 score 固定 ROI fallback。

  align:
    duration_gap_penalty: 8.0  # L1 duration DP 跳过 demo 回合的罚分。
    onset_tolerance_sec: 0.5  # L2 onset 事件匹配容差（秒）。
    veto_threshold: 0.25  # L2 匹配分低于此值时降低候选对齐置信度。

  sampling:
    phase2_interval_sec: 1.0  # 每局连续解码的 HUD YOLO 采样间隔（秒）。
    alignment_initial_sec: 10.0  # 每局开头连续执行 timer/score OCR 的时长（秒）。
    alignment_period_sec: 20.0  # 开局窗口之后的 timer/score OCR 周期（秒）。
    alignment_window_sec: 5.0  # 每个完整周期内执行 timer/score OCR 的窗口（秒）。
