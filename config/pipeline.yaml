profile: lite  # 当前运行/训练档位标识；运行时主要用于记录和选择默认策略。

runtime:
  backend: local  # local: host processes; container: host core plus Compose talk/voice services.
  manage_services: true  # 是否由编排器自动启动/停止本地或 Compose 服务。
  compose_file: docker-compose.yml  # manage_services 使用的 Compose 文件。
  one_model_at_a_time: true  # 是否串行占用语义和 TTS 模型显存。
  use_gpu_guard: false  # 阶段切换时是否调用 gpu_guard 释放/恢复显存。

  services:
    vllm:
      enabled: true  # 语义 vLLM 服务是否纳入服务管理。
      start: "bash docker/talk_entrypoint.sh"  # vLLM 服务启动命令。
      startup_timeout_sec: 180  # vLLM 服务就绪等待上限（秒）。
    sovits:
      enabled: true  # GPT-SoVITS 服务是否纳入服务管理。
      start: "bash -c 'cd /opt/GPT-SoVITS && python api_v2.py -a 0.0.0.0 -p 9880'"  # TTS 启动命令。
      startup_timeout_sec: 90  # TTS 服务就绪等待上限（秒）。

phases:
  demo_parse: true  # 是否解析原始 .dem 并生成 output/demo 工件。
  video_marking: true  # 是否运行 frame-type + 可选 replay 的视频粗标记（不调用 HUD YOLO/OCR）。
  preprocess_slice: true  # 是否根据 segments 生成回合级 rounds.json。
  phase2_yolo: true  # 是否运行 DEM 时间轴、HUD YOLO 和 POV/timer/score OCR 融合。
  phase3a_semantic: true  # 是否运行结构化语义分析。
  phase3b_semantic: true  # 是否运行人设/风格解说生成。
  phase4_assemble: true  # 是否运行 TTS 和逐局音视频混合。

debug:
  phase3: true  # 是否保留 Phase3 调试输出；正式运行按需关闭。

paths:
  demo: data\temp\sucai\gamerlegion-vs-big-m2-ancient.dem  # 原始 demo 输入路径。
  demo_output_dir: output/demo  # Go demo parser 的发布目录。
  video: data\temp\sucai\test_30min_h264.mp4  # 整场视频输入路径。
  map_name: Unknown  # 地图名；无法从外部数据获取时使用此值。
  hud_detections_jsonl: examples/offline/demo_detections.jsonl  # video_marking 逐帧检测输出；正式运行会由事务路径覆盖。
  segments_json:  # 可选的外部 segments 输入；为空时使用 video_marking 结果。
  clip_dir:  # 可选的 Phase1 提前切片目录；为空时 Phase4 延迟切片。

  rounds_json: output/sbmachine/rounds.json  # Phase1 回合包。
  round_list_json: output/sbmachine/round_list.json  # Phase1 轻量回合列表。
  segments_out_json: output/sbmachine/segments.json  # Phase1 segments 输出。
  rounds_with_yolo_json: output/sbmachine/rounds_with_yolo.json  # Phase2 时间轴、YOLO 和 POV 输出。
  rounds_with_yolo_semantic_json: output/sbmachine/rounds_with_yolo_semantic.json  # Phase2 派生的精简 DEM 事实帧时间轴（list[round]，不含 YOLO box/tags）。
  llma_input_json: output/sbmachine/llma_input.json  # Phase3a 定版的 LLM-A 输入中间产物：每窗规则集 plan + 增量状态报告(state_block) + 氛围帧。
  rounds_with_neutral_json: output/sbmachine/rounds_with_neutral.json  # Phase3a 中性语义输出。
  rounds_with_commentary_json: output/sbmachine/rounds_with_commentary.json  # Phase3b 解说输出。
  rounds_final_json: output/sbmachine/rounds_final.json  # Phase4 最终回合包。
  commentary_json: output/sbmachine/commentary.json  # Phase3b 独立 commentary 契约文件。
  assemble_manifest_json: output/sbmachine/assemble_manifest.json  # Phase4 音视频产物清单。

phase4:
  output_dir: output/sbmachine/rounds  # 逐局 WAV、scene WAV 和 MP4 输出目录。
  tts_cache_dir: output/tts_cache  # TTS 文本/配置指纹缓存目录。
  clip_cache_dir: output/clips  # 从整场视频延迟切出的逐局视频缓存目录。
  commentary_volume: 1.0  # 解说音量倍数。
  game_audio_volume: 0.25  # 游戏原声音量倍数。
  make_video: false  # 是否生成逐局带混音 MP4；false 时只生成音频。
