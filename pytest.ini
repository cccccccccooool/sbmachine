[pytest]
markers =
    contract: stage artifact contract tests
    runtime: configuration, transaction, progress, lock, and service orchestration tests
    demo_phase1: demo parsing, querying, segmentation, and Phase 1 tests
    phase2: vision, alignment, OCR, scene, and Phase 2 tests
    phase3a: neutral commentary planning, analysis, tactics, and Phase 3a tests
    phase3b: style, emotion policy, and Phase 3b tests
    phase4: TTS, cache, audio/video assembly, and Phase 4 tests
    mcp: MCP monitor service tests
    data_tools: data pipeline, training, and operational tool tests
    integration: tests that exercise multiple modules, subprocesses, CLIs, or transactional I/O
    ffmpeg: tests that require ffmpeg binaries
    slow: slow tests that are not part of the quick CPU suite
    runtime: runtime/service-manager unit tests
    demo_phase1: demo parse and phase1 tests
    phase2: phase2 timeline tests
    phase3a: phase3a tests
    phase3b: phase3b tests
    phase4: phase4 tests
    mcp: mcp server tests
    data_tools: data/training tool tests
    contract: stage contract tests
    integration: integration tests
