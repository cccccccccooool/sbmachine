# GPT-SoVITS 推理和训练路径配置。
# 路径可以是绝对路径，也可以是相对项目根目录的路径。
gpt_sovits_root: external/GPT-SoVITS

api:
  host: 127.0.0.1
  port: 9880
  tts_config: GPT_SoVITS/configs/tts_infer.yaml

model:
  # Fill these after training, or set GPT_SOVITS_GPT_WEIGHTS /
  # GPT_SOVITS_SOVITS_WEIGHTS in the runtime environment.
  gpt_weights: ""
  sovits_weights: ""

reference:
  # 可行性调查：直接引用素材库的两条参考音频（相对项目根）
  audio_path: data/audio/raw/hight/平淡.wav
  # 注意：prompt_text 必须与参考音频实际内容逐字一致，当前为占位文本，正式使用前需替换
  prompt_text: "兄弟们你看这个位置，这波要出事了。"
  prompt_lang: zh

# 情绪 -> 参考音频映射。所谓“语音模板”就是每种情绪最典型的一小段解说音频。
# 从已清洗的解说素材里，每种情绪挑 1~2 句最典型的当 ref 即可（情绪只认音色韵律，不进训练集）。
# prompt_text 必须与该 ref 音频内容逐字一致。缺失的情绪会自动回退到上面的默认 reference。
emotion_refs:
  平述:
    audio_path: data/audio/raw/hight/平淡.wav
    prompt_text: "现在双方都还剩三个人，经济也都起来了。"
  激动:
    # 由 random_review P1 随机切片(638s起,5.0s)生成；原 激动.wav 仅2.3s不满足3~10s要求。
    # prompt_text 为占位，正式使用前需替换为该片段逐字转写。
    audio_path: data/voice/refs/excited_clip.wav
    prompt_text: "现在双方都还剩三个人，经济也都起来了。"
  惊叹:
    # 同上：暂用 平淡.wav 顶替。
    audio_path: data/audio/raw/hight/平淡.wav
    prompt_text: "现在双方都还剩三个人，经济也都起来了。"

dataset:
  speaker: "6657"
  language: zh
  source_audio: data/audio/6657_ai_filtered.wav
  segments_jsonl: data/audio/6657_segments_ai.jsonl
  clip_dir: data/voice/clips
  list_path: data/voice/6657.list
  min_duration: 2.0
  max_duration: 12.0
